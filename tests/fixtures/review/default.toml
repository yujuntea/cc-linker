[meta]
name = "default"
description = "test profile"

[work]
provider = "qwen3.7"

[review]
provider = "kimi-coding"

[guards]
max_rounds = 6
max_concurrent_pipelines = 1
parse_retry_timeout_ms = 15000

[context_limits]
"claude-sonnet-4-5" = 1000000

# v2.1.6.1 M2: loadProfile validates all 6 required prompt templates. The fixture
# declares every one so basic load tests stay happy. Other test paths use the
# `tests/fixtures/review/incomplete-profile.toml` fixture to exercise the
# "missing required template" failure branch.

[prompts.work.produce.system]
template = "produce for {phase}: {task}; after producing, git -C <cwd> add -A && git commit --no-verify -m 'feat(produce-{phase})'"

[prompts.work.self_review.system]
template = "review {task} ; r1_or_r2_instruction={r1_or_r2_instruction}"

[prompts.work.fixing.system]
template = "fix {task}; issues={input_issues}; after fix, git -C <cwd> add -A && git commit --no-verify -m 'fix(FIXING): it'"

[prompts.review.spec.system]
template = "review spec {task}; use git log to see work pane's commits; then if needed fix + git -C <cwd> add -A && git commit --no-verify -m 'review(spec): fix it'"

[prompts.review.plan.system]
template = "review plan {task}; use git log to see work pane's commits; then if needed fix + git -C <cwd> add -A && git commit --no-verify -m 'review(plan): fix it'"

[prompts.review.code.system]
template = "review code {task}; use git log to see work pane's commits; then if needed fix + git -C <cwd> add -A && git commit --no-verify -m 'review(code): fix it'"

[phase_overrides.code]
review.provider = "kimi-coding"
guards.max_rounds = 6
